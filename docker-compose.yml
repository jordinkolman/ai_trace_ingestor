services:
  redis:
    image: redis/redis-stack:latest
    container_name: ai_trace_redis
    ports:
      - "127.0.0.1:6379:6379"
      - "127.0.0.1:8001:8001"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s 
      timeout: 3s 
      retries: 5

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: ai_trace_clickhouse
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
    environment:
      - CLICKHOUSE_DB=default
      - CLICKHOUSE_USER=${CLICKHOUSE_USER}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q 127.0.0.1:8123/ping || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: ai_trace_otel_collector
    volumes:
      - ${PWD}/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    environment:
      - CLICKHOUSE_USER=${CLICKHOUSE_USER}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    depends_on:
      clickhouse:
        condition: service_healthy
  
  ingestor:
    build: .
    container_name: ai_trace_ingestor
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - REDIS_HOST=redis 
    depends_on:
      redis:
        condition: service_healthy

  websocket-streamer:
    build: .
    container_name: ai_trace_websocket_streamer
    command: uvicorn ws_server:app --host 0.0.0.0 --port 8002
    ports:
      - "127.0.0.1:8002:8002"
    environment:
      - REDIS_HOST=redis 
    depends_on:
      redis:
        condition: service_healthy

  consumer:
    build: .
    container_name: ai_trace_consumer
    command: python consumer.py
    environment:
      - REDIS_HOST=redis
      - OTEL_EXPORTER_OTLP_ENDPOINT=otel-collector:4317
    depends_on:
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started

volumes:
  redis_data:
  clickhouse_data:
